<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Far Beacon 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Surveyor's desk again: slate panels over the view, lamp-amber accent. Readouts along the top edge, actions under the right thumb, left side kept clear for walking. */
        --ground: #161c26;
        --panel: rgba(22, 28, 38, 0.8);
        --solid: #1f2733;
        --line: #3a4757;
        --ink: #ece6d8;
        --ink-dim: #b3bcc5;
        --accent: #e0a84a;
        --water: #5aa9d6;
        --warm: #e58555;
        --stam: #93c26c;
        --bad: #ea6a62;
        --font-display: 'Bitter', Georgia, serif;
        --font-body: 'IBM Plex Sans', system-ui, sans-serif;
        --font-num: 'IBM Plex Mono', ui-monospace, monospace;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--ground);
        color: var(--ink);
        font: 400 14px/1.4 var(--font-body);
      }
      #c {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #perf {
        position: fixed;
        left: 8px;
        bottom: 8px;
        margin: 0;
        padding: 4px 6px;
        background: rgba(0, 0, 0, 0.55);
        color: #9fe39f;
        font: 11px/1.3 var(--font-num);
        pointer-events: none;
        z-index: 5;
        white-space: pre;
      }
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 8px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
      }
      .status,
      .sub {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 10px;
        align-items: center;
        font: 400 12px var(--font-num);
      }
      .sub {
        color: var(--ink-dim);
        margin-top: 4px;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 8px;
      }
      .chip.warn {
        border-color: var(--accent);
        color: var(--accent);
      }
      .chip.bad {
        border-color: var(--bad);
        color: var(--bad);
      }
      .meters {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 5px;
      }
      .meter {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 1px 6px;
        font-size: 12px;
        align-items: baseline;
      }
      .meter .track {
        grid-column: 1 / -1;
        height: 7px;
        background: #0f141b;
        border-radius: 4px;
        overflow: hidden;
      }
      .meter .fill {
        height: 100%;
        width: 50%;
      }
      #m-hp .fill {
        background: var(--bad);
      }
      #m-mana .fill {
        background: #8f7be0;
      }
      .lvl {
        font: 400 11.5px var(--font-num);
        color: var(--ink-dim);
        grid-column: 1 / -1;
        align-self: end;
      }
      #fight {
        position: fixed;
        left: 16px;
        right: 186px;
        bottom: 14px;
        background: var(--panel);
        border: 1px solid var(--bad);
        border-radius: 8px;
        padding: 8px 10px;
        pointer-events: none;
      }
      #fight[hidden] {
        display: none;
      }
      #fight .track {
        height: 8px;
        background: #0f141b;
        border-radius: 4px;
        overflow: hidden;
        margin: 4px 0;
      }
      #foe-bar {
        height: 100%;
        background: var(--bad);
      }
      #fight strong {
        font-family: var(--font-display);
      }
      #foe-val {
        font: 600 12px var(--font-num);
        float: right;
      }
      #foe-log {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
        font-size: 12px;
        color: var(--ink-dim);
        display: grid;
        gap: 2px;
      }
      #foe-log li:last-child {
        color: var(--ink);
      }
      #m-water .fill {
        background: var(--water);
      }
      #m-warm .fill {
        background: var(--warm);
      }
      #m-stam .fill {
        background: var(--stam);
      }
      .meter .val {
        font: 600 12px var(--font-num);
        font-variant-numeric: tabular-nums;
      }
      .meter.low .val,
      .bad {
        color: var(--bad);
      }
      .tools {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      button {
        pointer-events: auto;
        font: 500 13px var(--font-body);
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        min-height: 40px;
        padding: 5px 12px;
        cursor: pointer;
      }
      button:active {
        background: #2a3545;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #1a1205;
        font-weight: 600;
      }
      button.small {
        min-height: 38px;
        padding: 4px 10px;
      }
      button.sel {
        border-color: var(--accent);
        color: var(--accent);
        background: #2a2a22;
      }
      .scores {
        grid-template-columns: 1fr 1fr;
      }
      .scores .item {
        padding: 6px 8px;
      }
      #btn-pack.has {
        border-color: var(--accent);
        color: var(--accent);
      }
      #log {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 3px;
        font-size: 12.5px;
        max-width: 34em;
      }
      #log li {
        background: var(--panel);
        border-radius: 6px;
        padding: 3px 8px;
        color: var(--ink-dim);
        width: fit-content;
      }
      #log li.new {
        color: var(--ink);
        border: 1px solid var(--line);
      }
      #log li.good.new {
        border-color: var(--stam);
      }
      #log li.bad {
        color: #ffd0cc;
      }
      #log li.bad.new {
        border-color: var(--bad);
      }
      #actions {
        position: fixed;
        right: 16px;
        bottom: 14px;
        width: 158px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        pointer-events: none;
      }
      .act {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
        min-height: 38px;
        padding: 3px 10px;
        line-height: 1.2;
      }
      .act small {
        font: 400 10.5px var(--font-num);
        color: var(--ink-dim);
      }
      #stick {
        position: fixed;
        width: 110px;
        height: 110px;
        margin: -55px 0 0 -55px;
        border: 2px solid rgba(236, 230, 216, 0.45);
        border-radius: 50%;
        pointer-events: none;
        display: none;
      }
      #knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        background: rgba(236, 230, 216, 0.6);
      }
      #modal {
        position: fixed;
        inset: 0;
        background: rgba(8, 11, 16, 0.78);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 16px;
        overflow-y: auto;
        z-index: 5;
      }
      #modal[hidden] {
        display: none;
      }
      .sheet {
        width: 100%;
        max-width: 500px;
        background: var(--solid);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px 18px;
      }
      .sheet-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      h2 {
        font: 700 18px/1.2 var(--font-display);
        margin: 0;
        text-wrap: balance;
      }
      h3 {
        font: 600 14px/1.2 var(--font-display);
        margin: 14px 0 0;
        color: var(--accent);
      }
      p {
        margin: 6px 0;
      }
      .items {
        list-style: none;
        margin: 6px 0 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        background: #19212c;
        border: 1px solid var(--line);
        border-radius: 8px;
        flex-wrap: wrap;
      }
      .item p {
        margin: 2px 0 0;
        font-size: 12.5px;
        color: var(--ink-dim);
      }
      .item.cursed strong {
        color: var(--bad);
      }
      .item.tune input {
        flex: 1 1 100%;
      }
      .wt {
        font: 400 12px var(--font-num);
        color: var(--ink-dim);
        margin-left: 8px;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 4px;
      }
      .note {
        font-size: 12.5px;
        color: var(--ink-dim);
      }
      .journal li {
        font-size: 12.5px;
        color: var(--ink-dim);
        padding: 2px 0;
        border-bottom: 1px solid var(--line);
      }
      .journal li.bad {
        color: #ffd0cc;
      }
      #mapcv {
        width: 100%;
        aspect-ratio: 1;
        display: block;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-top: 8px;
      }
      input[type='number'] {
        font: 400 14px var(--font-num);
        width: 96px;
        min-height: 38px;
        background: #0f141b;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 8px;
      }
      textarea {
        width: 100%;
        margin-top: 6px;
        font: 400 12px var(--font-num);
        background: #0f141b;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 8px;
      }
      input[type='checkbox'] {
        width: 22px;
        height: 22px;
        accent-color: var(--accent);
      }
      input[type='range'] {
        accent-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <canvas id="c" aria-label="First-person view of the land"></canvas>
    <div id="hud">
      <div class="card">
        <div class="status">
          <span id="when">Day 1</span><span id="sky" class="chip">Clear</span><span id="facing">Facing E</span
          ><span id="bearing"></span>
        </div>
        <div class="meters">
          <div class="meter" id="m-hp">
            <span>Health</span><span class="val" id="m-hp-val"></span>
            <div class="track"><div class="fill" id="m-hp-bar"></div></div>
          </div>
          <div class="meter" id="m-mana">
            <span>Mana</span><span class="val" id="m-mana-val"></span>
            <div class="track"><div class="fill" id="m-mana-bar"></div></div>
          </div>
          <div class="meter"><span id="lvl" class="lvl">Level 1</span></div>
          <div class="meter" id="m-water">
            <span>Water</span><span class="val" id="m-water-val"></span>
            <div class="track"><div class="fill" id="m-water-bar"></div></div>
          </div>
          <div class="meter" id="m-warm">
            <span>Warmth</span><span class="val" id="m-warm-val"></span>
            <div class="track"><div class="fill" id="m-warm-bar"></div></div>
          </div>
          <div class="meter" id="m-stam">
            <span>Stamina</span><span class="val" id="m-stam-val"></span>
            <div class="track"><div class="fill" id="m-stam-bar"></div></div>
          </div>
        </div>
        <div class="sub"><span id="load"></span><span id="fuel"></span><span id="place"></span></div>
      </div>
      <div class="tools">
        <button type="button" id="btn-pack">Pack</button><button type="button" id="btn-map">Map</button
        ><button type="button" id="btn-menu">Menu</button>
      </div>
      <ul id="log" aria-live="polite"></ul>
    </div>
    <div id="fight" hidden>
      <strong id="foe-name"></strong><span id="foe-val"></span>
      <div class="track"><div id="foe-bar"></div></div>
      <ul id="foe-log"></ul>
    </div>
    <div id="actions"></div>
    <div id="stick"><div id="knob"></div></div>
    <div id="modal" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="sheet-head">
          <h2 id="modal-title"></h2>
          <button type="button" id="modal-close" class="small">Close</button>
        </div>
        <div id="modal-body"></div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      if (!window.THREE)
        document.getElementById('log').innerHTML =
          '<li class="bad new">The 3D library did not load. Check your connection and reload the page.</li>';
      var GAME_VERSION = 'v0.14';
      var INTRO_EXTRA = 'Your goal is on the top panel. Stores are in Pack; controls and past messages are in Menu.';
    </script>

      for (const o of sel.options) if ((lastSet[key] || []).includes(o.value)) o.selected = true;
      fields[key] = sel;
      return el("li", { cls: "item" }, [el("label", { for: "nw-" + key, text: label }), sel]);
    };
    const count = (key, label) => {
      const inp = el("input", { type: "number", id: "nw-" + key, min: "0", max: "40", value: String(cur(key) || 0) });
      fields[key] = inp;
      return el("li", { cls: "item" }, [el("label", { for: "nw-" + key, text: label }), inp]);
    };
    const troubles = [["", "Rolled"]].concat(R.C.plots.kinds.filter((k) => k.main).map((k) => [k.id, k.name]));
    const details = el("details", { id: "nw-more" }, [
      el("summary", { text: "World settings" }),
      el("p", { cls: "note", text: "Leave these alone for an ordinary world. Hold Ctrl (or long-press) to pick several peoples." }),
      el("ul", { cls: "items" }, [
        choose("size", "Size", M2.size, lastSet.size || ""),
        many("races", "Races that may appear (none picked: any)", R.C.races),
        count("nRaces", "How many races (0: rolled)"),
        many("classes", "Classes that may appear (none picked: any)", R.C.classes),
        count("nClasses", "How many classes (0: rolled)"),
        choose("towns", "Other towns", M2.towns, cur("towns")),
        choose("dungeons", "Dungeons", M2.dungeons, cur("dungeons")),
        choose("depth", "How deep they go", M2.depth, cur("depth")),
        choose("sky", "Places in the sky", M2.sky, cur("sky")),
        choose("sea", "A sea", M2.sea, cur("sea")),
        choose("doors", "Doors to other worlds", M2.doors, cur("doors")),
        choose("maxDoors", "How many doors", M2.maxDoors, cur("maxDoors")),
        choose("trouble", "The great trouble", troubles, cur("trouble"))
      ])
    ]);
    openModal("A new world", [
      el("div", { cls: "row" }, [el("label", { for: "nw-seed", text: "Seed" }), seedIn]),
      details,
      el("div", { cls: "row" }, [
        btn(
          "Make this world",
          () => {
            const set = {};
            for (const k in fields) {
              const f = fields[k];
              if (f.multiple) set[k] = [...f.options].filter((o) => o.selected).map((o) => o.value);
              else if (k === "size" || k === "trouble") set[k] = f.value;
              else set[k] = parseFloat(f.value);
            }
            lastSet = set;
            start(parseInt(seedIn.value, 10) || 1, set);
          },
          "primary"
        ),
        V.S && !V.S.over ? btn("Back", () => openMenu()) : null
      ])
    ]);
  }
  function openMenu() {
    const sw = el(
      "ul",
      { cls: "items" },
      R.SWITCHES.map(([id, label]) => {
        const cb = el("input", { type: "checkbox", id: "sw-" + id });
        cb.checked = !V.S.off[id];
        cb.addEventListener("change", () => {
          V.S.off[id] = !cb.checked;
          render();
          save();
        });
        return el("li", { cls: "item" }, [el("label", { for: "sw-" + id, text: label }), cb]);
      })
    );
    const tune = (obj, key, label, min, max, step) => {
      const out = el("span", { cls: "wt", text: String(obj[key]) }), r = el("input", { type: "range", id: "tn-" + key, min, max, step, value: obj[key] });
      r.addEventListener("input", () => {
        obj[key] = parseFloat(r.value);
        out.textContent = r.value;
        render();
        save();
      });
      return el("li", { cls: "item tune" }, [el("label", { for: "tn-" + key, text: label }), out, r]);
    };
    const seedIn = el("input", { type: "number", id: "seed-in", value: V.S.seed, inputmode: "numeric" });
    openModal("Menu", [
      el("h3", { text: "How to play" }),
      el("p", {
        text: "Your goal is on the top panel, with a direction when you know one. It begins with finding the town, whose smoke you can see from far off. Phone: left thumb walks, right thumb looks. Computer: W A S D to walk, drag the view or use Q and E to turn."
      }),
      el("p", {
        text: "Time only passes when you walk or act, so stop whenever you want to think. Creatures are rare and usually visible before they reach you; a fight is turn by turn, and fleeing is often the right call. A creature's eyes tell its temper: red hunts you, orange guards its ground, yellow keeps to itself. Water drains as you travel. Cold drains warmth at night and in storms. Stamina keeps you alive when either runs out."
      }),
      el("p", {
        text: "You cannot carry enough water to cross in one go. Look for green ground and blue pools, search ruins and caves, leave water and fuel as depots from the Pack screen, and move your camp forward to a cave or ruin."
      }),
      el("p", {
        text: "The ground matters. Each land has its own woods, watercourses and odd terrain: some shelter you, some give water or fuel, some are fast and some are punishing. The line under the meters says what you are standing on."
      }),
      el("p", {
        text: "There is more than the land. Stairs in caves, ruins and town cellars go down into dungeons, harder and richer the deeper you go; they are dark, so bring a light. Something may float in the sky over a shadow with no cloud to cast it: you need a way to fly, and flying is quick but tiring, cold and grounded by storms. Deep water needs a boat or a way to breathe it. And rarely a door of old stone leads to another world. The goal line always points the next step of the way: a stair, a shadow, a door."
      }),
      el("h3", { text: "Goal" }),
      el("p", {
        text: ((o) => o.text + (o.dir && o.dir !== "here" ? ", to the " + o.dir : "") + ".")(R.objective(V.S)) + (V.S.quest.told ? " " + V.S.town.elder + " of " + V.S.town.name + " told you: the " + V.S.quest.relic + " lies in the " + V.S.quest.vault.name + " and belongs at the " + V.S.quest.dest + "." : " The town will know what this land needs.")
      }),
      ...(() => {
        const known = R.plotsOf(V.S).filter((p) => p.kind === "relic" ? V.S.quest.told && !p.main : p.known);
        if (!known.length) return [];
        const cur = R.tracked(V.S);
        return [
          el("h3", { text: "Troubles" }),
          el(
            "ul",
            { cls: "items" },
            known.map((p) => {
              const k = R.byId(R.C.plots.kinds, p.kind), o = p.kind === "relic" ? { text: k.text } : R.plotObjective(V.S, p);
              return el("li", { cls: "item" }, [
                el("div", null, [
                  el("strong", { text: k.name + (p.main ? " (the great trouble)" : "") }),
                  el("p", {
                    text: p.done ? "Done." : p.failed ? "Failed." : o.text + (o.dir && o.dir !== "here" ? ", to the " + o.dir : "") + "."
                  })
                ]),
                !p.done && !p.failed && cur !== p ? btn("Follow", () => {
                  R.trackPlot(V.S, p.id);
                  render();
                  save();
                  openMenu();
                }) : el("span", { cls: "wt", text: cur === p ? "followed" : "" })
              ]);
            })
          )
        ];
      })(),
      el("h3", { text: "Traveller" }),
      el("p", {
        text: R.charTitle(V.S.char) + ", traveller " + V.S.travellers + " of " + V.S.tun.lives + ". " + R.byId(R.C.races, V.S.char.race).text + " " + R.byId(R.C.classes, V.S.char.cls).text
      }),
      el("p", {
        cls: "note",
        text: "Level " + V.S.player.level + ", " + V.S.player.xp + " of " + R.xpFor(V.S.player.level) + " experience. Experience comes from finding places, searching them, learning about the lost people, and winning fights. In a fight: " + R.byId(R.C.classes, V.S.char.cls).fight
      }),
      el(
        "ul",
        { cls: "items scores" },
        R.charSheet(V.S.char).map(
          (a) => el("li", { cls: "item" }, [el("div", null, [el("strong", { text: a.name + " " + a.score }), el("p", { text: a.text })])])
        )
      ),
      el("h3", { text: "Creatures met" }),
      el("p", {
        cls: "note",
        text: V.S.species.filter((x) => x.met).map(
          (x) => x.name + ": " + R.byId(R.C.creature.forms, x.form).text + " " + R.byId(R.C.creature.tempers, x.temper).text + (R.specialOf(V.S, x).text ? " " + R.specialOf(V.S, x).text : "")
        ).join(" ") || "None yet. They are few, and you will usually see one before it reaches you."
      }),
      el("h3", { text: "This world" }),
      el("p", {
        text: R.biomeOf(V.S).name + ". " + (V.S.known.god ? "Shrine of " + R.godOf(V.S).name + "." : "A god is worshipped somewhere here.") + " Seed " + V.S.seed + "."
      }),
      el(
        "ul",
        { cls: "items" },
        R.worldNotes(V.S).map(
          (n) => el("li", { cls: "item" }, [el("div", null, [el("strong", { text: n.label }), el("p", { text: n.text })])])
        )
      ),
      el("p", {
        text: V.S.known.civ ? "The people who lived here were " + R.civOf(V.S).name + ". Each ruin you search teaches you more about them." : "A people lived here once. Search a ruin to learn who they were."
      }),
      el(
        "ul",
        { cls: "items" },
        R.civTraits(V.S).map(
          (tr) => el("li", { cls: "item" }, [
            el("div", null, [
              el("strong", {
                text: tr.known ? tr.label : {
                  habit: "What they built",
                  age: "How long ago",
                  style: "Who they were",
                  affinity: "Their sign",
                  doom: "How they ended"
                }[tr.axis] + ": unknown"
              }),
              tr.known ? el("p", { text: tr.text }) : null
            ])
          ])
        )
      ),
      el("h3", { text: "Codex" }),
      el("p", {
        cls: "note",
        text: Object.keys(codex).length + " of " + codexTotal + " traits of lost peoples understood, across all your runs."
      }),
      el(
        "ul",
        { cls: "items journal" },
        Object.keys(codex).sort().map((k) => {
          const [ax, id] = k.split(":"), tx = R.traitText(ax, id);
          return el("li", { text: tx.label + ": " + tx.text });
        })
      ),
      el("div", { cls: "row" }, [
        btn("New world", () => openNewWorld(), "primary"),
        seedIn,
        btn("Play this seed", () => start(parseInt(seedIn.value, 10) || 1))
      ]),
      el("h3", { text: "Journal" }),
      el(
        "ul",
        { cls: "items journal" },
        V.S.log.slice(-12).reverse().map((l) => el("li", { cls: l.tone || "", text: l.msg }))
      ),
      el("h3", { text: "Saved game" }),
      el("p", {
        cls: "note",
        text: "Your run saves itself in this browser. To move it to another device, copy it here and load it there."
      }),
      (() => {
        const box3 = el("textarea", {
          id: "save-text",
          rows: "3",
          placeholder: "Paste a saved game here",
          "aria-label": "Saved game text"
        }), msg = el("p", { cls: "note", id: "save-msg" });
        const copy = btn("Copy this run", () => {
          const txt = R.serialize(V.S);
          box3.value = txt;
          try {
            navigator.clipboard.writeText(txt).then(
              () => msg.textContent = "Copied. Paste it into Menu on the other device.",
              () => msg.textContent = "Copy the text in the box by hand."
            );
          } catch (e) {
            msg.textContent = "Copy the text in the box by hand.";
          }
        });
        const loadIt = btn("Load the pasted run", () => {
          const res = R.deserialize(box3.value.trim());
          if (res.error) {
            msg.textContent = res.error;
            return;
          }
          enter(res.state);
          if (V.S.over) showEnd();
        });
        return el("div", null, [box3, el("div", { cls: "row" }, [copy, loadIt]), msg]);
      })(),
      el("h3", { text: "Settings" }),
      el("p", {
        cls: "note",
        text: "Graphics quality for this device. Low draws less land and fewer trees, at a lower resolution: use it if the game stutters. Smoothing of edges changes the next time the page is loaded."
      }),
      el(
        "div",
        { cls: "row" },
        Object.keys(QUALITY).map(
          (k) => btn(
            QUALITY[k].label + (SET.quality === k ? " (now)" : ""),
            () => {
              setQuality(k);
              renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.ratio));
              resize();
              buildStatic();
              buildDynamic();
              openMenu();
            },
            SET.quality === k ? "primary" : ""
          )
        )
      ),
      (() => {
        const cb = el("input", { type: "checkbox", id: "perf-meter" });
        cb.checked = !!SET.meter;
        cb.addEventListener("change", () => {
          SET.meter = cb.checked;
          saveSettings();
        });
        return el("ul", { cls: "items" }, [
          el("li", { cls: "item" }, [el("label", { for: "perf-meter", text: "Show the performance meter" }), cb])
        ]);
      })(),
      el("h3", { text: "Tinker" }),
      el("p", { cls: "note", text: "Switch whole systems off, or change the numbers while you play." }),
      godPanel(),
      errors.length || V.S.godMode ? el("div", { cls: "row" }, [
        btn("Rescue: back to the well", () => {
          act(() => R.rescue(V.S));
          buildStatic();
          placePlayer();
          closeModal();
        })
      ]) : null,
      sw,
      el("ul", { cls: "items" }, [
        tune(VIEW, "speed", "Walking speed (m/s)", 3, 16, 0.5),
        tune(V.S.tun, "waterPerHour", "Water used per hour", 0.2, 2, 0.1),
        tune(V.S.tun, "coldScale", "Cold strength", 0, 2, 0.1),
        tune(V.S.tun, "staminaScale", "Effort per step", 0.2, 2, 0.1),
        tune(V.S.tun, "stormGap", "Time between storms", 0.2, 3, 0.1),
        tune(V.S.tun, "carryCap", "Carry limit", 8, 40, 1),
        tune(V.S.tun, "lives", "Travellers per world", 1, 9, 1)
      ]),
      el("div", { cls: "row" }, [
        btn("Reveal the whole map", () => {
          R.reveal(V.S, 18, 18, 60, true);
          save();
          openMap();
        })
      ]),
      el("p", { cls: "note", text: "Far Beacon " + (typeof GAME_VERSION === "string" ? GAME_VERSION : "") })
    ]);
  }
  var cv = $("c");
  var look = (mx, my, k) => {
    P3.yaw -= mx * k;
    P3.pitch = clamp2(P3.pitch - my * k, -1.2, 1.2);
  };
  document.addEventListener("keydown", (e) => {
    if (!$("modal").hidden) {
      if (e.key === "Escape" && !V.locked) closeModal();
      return;
    }
    const k = e.key.toLowerCase();
    if (["w", "a", "s", "d", "q", "e", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) {
      input.keys[k] = true;
      e.preventDefault();
    }
  });
  document.addEventListener("keyup", (e) => {
    input.keys[e.key.toLowerCase()] = false;
  });
  window.addEventListener("blur", () => {
    input.keys = {};
  });
  var dragging = false;
  var lx = 0;
  var ly = 0;
  cv.addEventListener("mousedown", (e) => {
    dragging = true;
    lx = e.clientX;
    ly = e.clientY;
  });
  window.addEventListener("mouseup", () => {
    dragging = false;
  });
  window.addEventListener("mousemove", (e) => {
    if (dragging) {
      look(e.clientX - lx, e.clientY - ly, 5e-3);
      lx = e.clientX;
      ly = e.clientY;
    }
  });
  var moveId = null;
  var lookId = null;
  var ox = 0;
  var oy = 0;
  var tlx = 0;
  var tly = 0;
  var stick = $("stick");
  var knob = $("knob");
  cv.addEventListener(
    "touchstart",
    (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.clientX < window.innerWidth * 0.45 && moveId === null) {
          moveId = t.identifier;
          ox = t.clientX;
          oy = t.clientY;
          stick.style.display = "block";
          stick.style.left = ox + "px";
          stick.style.top = oy + "px";
          knob.style.transform = "";
        } else if (lookId === null) {
          lookId = t.identifier;
          tlx = t.clientX;
          tly = t.clientY;
        }
      }
    },
    { passive: false }
  );
  cv.addEventListener(
    "touchmove",
    (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier === moveId) {
          let dx = t.clientX - ox, dy = t.clientY - oy;
          const d = Math.hypot(dx, dy), RR2 = 50;
          if (d > RR2) {
            dx *= RR2 / d;
            dy *= RR2 / d;
          }
          input.fx = dx / RR2;
          input.fy = -dy / RR2;
          knob.style.transform = "translate(" + dx + "px," + dy + "px)";
        } else if (t.identifier === lookId) {
          look(t.clientX - tlx, t.clientY - tly, 6e-3);
          tlx = t.clientX;
          tly = t.clientY;
        }
      }
    },
    { passive: false }
  );
  var endTouch = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === moveId) {
        moveId = null;
        input.fx = input.fy = 0;
        stick.style.display = "none";
      }
      if (t.identifier === lookId) lookId = null;
    }
  };
  cv.addEventListener("touchend", endTouch);
  cv.addEventListener("touchcancel", endTouch);
  $("btn-pack").addEventListener("click", () => V.S && !V.S.over && openPack());
  $("btn-map").addEventListener("click", () => V.S && openMap());
  $("btn-menu").addEventListener("click", () => V.S && openMenu());
  $("modal-close").addEventListener("click", () => {
    if (!V.locked) closeModal();
  });
  window.addEventListener("resize", resize);
  resize();
  var saved = load();
  if (saved) {
    enter(saved);
    if (V.S.over) showEnd();
  } else start(randomSeed());
  window.__g = {
    get S() {
      return V.S;
    },
    P: P3,
    V,
    VIEW,
    input,
    scene,
    renderer,
    buildStatic,
    PF,
    Q,
    setQuality(name) {
      setQuality(name);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.ratio));
      resize();
    },
    // a fresh world on this seed, without the character screen (for the benchmark)
    newWorld(seed, set) {
      enter(R.newGame(seed, {}, set));
    },
    // for tests and tinkering from the console: redraw everything after changing the state by hand
    refresh() {
      sync();
      placePlayer();
      buildDynamic();
      render();
    }
  };
  window.addEventListener("error", (e) => show("the page", e.error || e.message));
  window.addEventListener("unhandledrejection", (e) => show("the page", e.reason));
  requestAnimationFrame(loop);

  // src/main.js
  globalThis.Rules = Rules;
})();

    </script>
