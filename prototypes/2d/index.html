<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Far Beacon Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* One visual world: a surveyor's night desk. Slate ground, lamp-amber accent, map in the middle, controls under the thumb. */
  --ground: #161c26; --panel: #1f2733; --line: #33404f; --ink: #ece6d8; --ink-dim: #9da8b3; --accent: #e0a84a;
  --water: #5aa9d6; --warm: #e58555; --stam: #93c26c; --bad: #ea6a62;
  --font-display: 'Bitter', Georgia, serif; --font-body: 'IBM Plex Sans', system-ui, sans-serif; --font-num: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font: 400 15px/1.45 var(--font-body); }
main { max-width: 520px; margin: 0 auto; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 10px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font: 700 20px/1.1 var(--font-display); margin: 0; letter-spacing: .01em; }
h1 small { font: 400 12px var(--font-num); color: var(--ink-dim); margin-left: 8px; }
h2, h3 { font: 600 16px/1.2 var(--font-display); margin: 0; text-wrap: balance; }
h3 { margin-top: 14px; font-size: 14px; color: var(--accent); }
p { margin: 6px 0; }
button { font: 500 14px var(--font-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 44px; padding: 6px 12px; cursor: pointer; }
button:active { background: #2a3545; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #1a1205; font-weight: 600; }
button.small { min-height: 38px; padding: 4px 10px; font-size: 13px; }
.status { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 400 13px var(--font-num); }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
.chip.warn { border-color: var(--accent); color: var(--accent); }
.chip.bad { border-color: var(--bad); color: var(--bad); }
#bearing { color: var(--ink-dim); }
.meters { display: grid; gap: 5px; }
.meter { display: grid; grid-template-columns: 62px 1fr 78px; align-items: center; gap: 8px; font-size: 13px; }
.meter .track { height: 10px; background: #0f141b; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.meter .bar { height: 100%; width: 50%; }
#m-water .bar { background: var(--water); } #m-warm .bar { background: var(--warm); } #m-stam .bar { background: var(--stam); }
.meter .val { font: 600 13px var(--font-num); text-align: right; font-variant-numeric: tabular-nums; }
.meter.low .val, .bad { color: var(--bad); }
.sub { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 400 12px var(--font-num); color: var(--ink-dim); }
canvas { width: 100%; aspect-ratio: 1; display: block; border: 1px solid var(--line); border-radius: 8px; background: #10151d; touch-action: manipulation; }
#place { font-size: 13px; color: var(--ink-dim); }
.controls { display: grid; grid-template-columns: 148px 1fr; gap: 12px; align-items: start; }
.dpad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); gap: 5px; }
.dpad button { padding: 0; font-size: 18px; }
#d-up { grid-area: 1 / 2; } #d-left { grid-area: 2 / 1; } #d-right { grid-area: 2 / 3; } #d-down { grid-area: 3 / 2; }
#actions { display: flex; flex-wrap: wrap; gap: 6px; }
.act { display: flex; flex-direction: column; align-items: flex-start; text-align: left; flex: 1 1 120px; }
.act small { font: 400 11px var(--font-num); color: var(--ink-dim); }
.bar-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
#log { list-style: none; margin: 0; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: grid; gap: 6px; font-size: 13.5px; }
#log li { color: var(--ink-dim); } #log li.new { color: var(--ink); } #log li.good.new { color: var(--stam); } #log li.bad { color: var(--bad); }
#modal { position: fixed; inset: 0; background: rgba(8, 11, 16, .78); display: flex; align-items: flex-start; justify-content: center; padding: 16px; overflow-y: auto; z-index: 5; }
#modal[hidden] { display: none; }
.sheet { width: 100%; max-width: 500px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 18px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.items { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 6px; }
.item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; background: #19212c; border: 1px solid var(--line); border-radius: 8px; flex-wrap: wrap; }
.item p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-dim); }
.item.cursed strong { color: var(--bad); }
.item.tune input { flex: 1 1 100%; }
.wt { font: 400 12px var(--font-num); color: var(--ink-dim); margin-left: 8px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.note { font-size: 12.5px; color: var(--ink-dim); }
input[type=number] { font: 400 14px var(--font-num); width: 96px; min-height: 38px; background: #0f141b; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
input[type=range] { accent-color: var(--accent); }
@media (max-width: 380px) { .controls { grid-template-columns: 1fr; } .dpad { margin: 0 auto; } }
</style>
</head>
<body>
<main>
  <header><h1>Far Beacon<small id="seed">seed</small></h1><button type="button" id="btn-menu" class="small">Menu and help</button></header>
  <div class="status"><span id="when">Day 1</span><span id="sky" class="chip">Clear</span><span id="bearing"></span></div>
  <div class="meters">
    <div class="meter" id="m-water"><span>Water</span><div class="track"><div class="bar" id="m-water-bar"></div></div><span class="val" id="m-water-val"></span></div>
    <div class="meter" id="m-warm"><span>Warmth</span><div class="track"><div class="bar" id="m-warm-bar"></div></div><span class="val" id="m-warm-val"></span></div>
    <div class="meter" id="m-stam"><span>Stamina</span><div class="track"><div class="bar" id="m-stam-bar"></div></div><span class="val" id="m-stam-val"></span></div>
  </div>
  <div class="sub"><span id="load"></span><span id="fuel"></span></div>
  <canvas id="map" aria-label="Map. Tap a tile next to you to walk there."></canvas>
  <div id="place"></div>
  <div class="controls">
    <div class="dpad" aria-label="Walk">
      <button type="button" id="d-up" aria-label="North">&#9650;</button><button type="button" id="d-left" aria-label="West">&#9664;</button>
      <button type="button" id="d-right" aria-label="East">&#9654;</button><button type="button" id="d-down" aria-label="South">&#9660;</button>
    </div>
    <div id="actions"></div>
  </div>
  <div class="bar-row"><button type="button" id="btn-pack">Pack</button><button type="button" id="btn-view">Whole map</button></div>
  <ul id="log" aria-live="polite"></ul>
</main>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="sheet-head"><h2 id="modal-title"></h2><button type="button" id="modal-close" class="small">Close</button></div><div id="modal-body"></div></div></div>
<script>
/* CONTENT: every biome, civilization, god, item base and affix is data. Adding an entry needs no code change. */
const CONTENT = {
  tun: {
    waterPerHour: 0.8, restWaterFactor: 0.5, staminaScale: 1, coldScale: 1, stormGap: 1,
    carryCap: 16, lanternFuelPerHour: 0.25, autoIdHours: 10,
    moveMin: { plain: 15, hill: 30, mountain: 60 },
    moveSta: { plain: 2, hill: 4, mountain: 8 }
  },
  biomes: [
    { id: 'salt', name: 'Salt Flats', blurb: 'Hot days, thin water, dust on the wind.',
      hills: 0.18, mountains: 0.05, springs: 4, foul: 0.15,
      day: { cold: 0, warm: 6, mods: [{ stat: 'waterDrain', op: 'mul', value: 1.4 }] },
      night: { cold: 6, warm: 0, mods: [] },
      storm: { name: 'dust storm', cold: 0, mods: [{ stat: 'moveTime', op: 'mul', value: 1.6 }, { stat: 'waterDrain', op: 'mul', value: 1.3 }] },
      colors: ['#cdbf9c', '#b0966a', '#7a6650'] },
    { id: 'moor', name: 'High Moor', blurb: 'Water everywhere, much of it foul. Rain and cold nights.',
      hills: 0.30, mountains: 0.06, springs: 7, foul: 0.4,
      day: { cold: 3, warm: 2, mods: [] },
      night: { cold: 8, warm: 0, mods: [] },
      storm: { name: 'rainstorm', cold: 10, mods: [{ stat: 'moveTime', op: 'mul', value: 1.25 }] },
      colors: ['#7c9463', '#5f7653', '#55585e'] },
    { id: 'taiga', name: 'Snowbound Taiga', blurb: 'Always cold. Snow can be melted for water if you have fuel.',
      hills: 0.25, mountains: 0.10, springs: 2, foul: 0.1, melt: 3,
      day: { cold: 6, warm: 2, mods: [] },
      night: { cold: 12, warm: 0, mods: [] },
      storm: { name: 'blizzard', cold: 14, mods: [{ stat: 'moveTime', op: 'mul', value: 1.5 }] },
      colors: ['#dfe6e8', '#a3b7b3', '#6c7b85'] }
  ],
  civs: [
    { id: 'cistern', name: 'the Cistern-Keepers', ruin: 'cistern-house',
      lore: 'The Cistern-Keepers always built over stored water.',
      search: { hours: 1, items: 1, water: 5 } },
    { id: 'way', name: 'the Waymakers', ruin: 'watchtower', onHills: true,
      lore: 'The Waymakers built towers where the land could be read.',
      search: { hours: 1, items: 1, reveal: 6 } },
    { id: 'tomb', name: 'the Tomb-Carvers', ruin: 'sealed tomb',
      lore: 'The Tomb-Carvers buried their goods deep. Opening a tomb is hard work.',
      search: { hours: 2, stamina: 20, items: 3 } }
  ],
  gods: [
    { id: 'thirst', name: 'Ushet, the Dry Mother',
      terms: 'You need half the water. You can never carry more than 4.',
      mods: [{ stat: 'waterDrain', op: 'mul', value: 0.5 }, { stat: 'waterCap', op: 'max', value: 4 }] },
    { id: 'climber', name: 'Karn of the High Places',
      terms: 'Hills and mountains cost you far less time. Flat ground costs more.',
      mods: [{ stat: 'moveTime.hill', op: 'mul', value: 0.6 }, { stat: 'moveTime.mountain', op: 'mul', value: 0.6 }, { stat: 'moveTime.plain', op: 'mul', value: 1.3 }] },
    { id: 'night', name: 'Nym, the Lidless',
      terms: 'You see in the dark and the night cold bites less. By day you need much more water.',
      mods: [{ stat: 'nightSight', op: 'add', value: 1, when: 'night' }, { stat: 'cold', op: 'mul', value: 0.6, when: 'night' }, { stat: 'waterDrain', op: 'mul', value: 1.4, when: 'day' }] }
  ],
  bases: [
    { id: 'waterskin', name: 'Waterskin', wt: 0.5, w: 3, mods: [{ stat: 'waterCap', op: 'add', value: 3 }] },
    { id: 'cloak', name: 'Cloak', wt: 2, w: 3, mods: [{ stat: 'cold', op: 'mul', value: 0.7 }] },
    { id: 'boots', name: 'Boots', wt: 1, w: 2, mods: [{ stat: 'staminaCost', op: 'mul', value: 0.9 }] },
    { id: 'lantern', name: 'Lantern', wt: 1, w: 2, mods: [{ stat: 'nightSight', op: 'add', value: 1, needsFuel: true }] },
    { id: 'spyglass', name: 'Spyglass', wt: 1, w: 2, mods: [{ stat: 'surveyRadius', op: 'add', value: 2 }] },
    { id: 'framepack', name: 'Frame Pack', wt: 1, w: 2, mods: [{ stat: 'carryCap', op: 'add', value: 8 }] },
    { id: 'staff', name: 'Staff', wt: 1, w: 2, mods: [{ stat: 'staminaCost', op: 'mul', value: 0.85 }] },
    { id: 'rope', name: 'Rope', wt: 2, w: 2, mods: [{ stat: 'moveTime.mountain', op: 'mul', value: 0.5 }] },
    { id: 'compass', name: 'Compass', wt: 0.2, w: 2, mods: [{ stat: 'goalDistance', op: 'add', value: 1 }] },
    { id: 'tonic', name: 'Tonic', wt: 0.3, w: 3, consumable: true, plain: true, use: { stamina: 40 } },
    { id: 'draught', name: 'Warming Draught', wt: 0.3, w: 3, consumable: true, plain: true, use: { warmth: 40 } },
    { id: 'flask', name: 'Flask', wt: 0.3, w: 4, consumable: true, mystery: true },
    { id: 'campkit', name: 'Camp Kit', wt: 5, w: 0, plain: true, mods: [] }
  ],
  flasks: [
    { name: 'Flask of Springwater', use: { water: 2 } },
    { name: 'Flask of Brine', use: { stamina: -20 } },
    { name: 'Flask of Firewine', use: { warmth: 35, stamina: -5 } },
    { name: 'Flask of Vigor', use: { stamina: 50 } }
  ],
  affixes: [
    { id: 'leaky', pos: 'pre', name: 'Leaky', for: ['waterskin'], cursed: true, mods: [{ stat: 'leak', op: 'add', value: 0.4 }] },
    { id: 'deep', pos: 'pre', name: 'Deep', for: ['waterskin'], mods: [{ stat: 'waterCap', op: 'add', value: 2 }] },
    { id: 'oilskin', pos: 'pre', name: 'Oilskin', for: ['cloak'], mods: [{ stat: 'stormCold', op: 'mul', value: 0 }] },
    { id: 'threadbare', pos: 'pre', name: 'Threadbare', for: ['cloak'], cursed: true, mods: [{ stat: 'cold', op: 'mul', value: 1.3 }] },
    { id: 'feather', pos: 'pre', name: 'Featherweight', for: 'gear', wtMul: 0, mods: [] },
    { id: 'leaden', pos: 'pre', name: 'Leaden', for: 'gear', cursed: true, wtMul: 3, mods: [] },
    { id: 'miser', pos: 'pre', name: "Miser's", for: ['lantern'], mods: [{ stat: 'fuelUse', op: 'mul', value: 0.5 }] },
    { id: 'sturdy', pos: 'pre', name: 'Sturdy', for: ['boots', 'staff'], mods: [{ stat: 'staminaCost', op: 'mul', value: 0.9 }] },
    { id: 'blister', pos: 'pre', name: 'Blistering', for: ['boots'], cursed: true, mods: [{ stat: 'staminaCost', op: 'mul', value: 1.25 }] },
    { id: 'broad', pos: 'pre', name: 'Broad', for: ['framepack'], mods: [{ stat: 'carryCap', op: 'add', value: 4 }] },
    { id: 'fogged', pos: 'pre', name: 'Fogged', for: ['spyglass'], cursed: true, mods: [{ stat: 'surveyRadius', op: 'add', value: -3 }] },
    { id: 'camel', pos: 'suf', name: 'of the Camel', for: 'gear', mods: [{ stat: 'waterDrain', op: 'mul', value: 0.75 }] },
    { id: 'goat', pos: 'suf', name: 'of the Goat', for: ['boots', 'staff', 'rope'], mods: [{ stat: 'moveTime.hill', op: 'mul', value: 0.7 }] },
    { id: 'surveyor', pos: 'suf', name: 'of the Surveyor', for: ['spyglass', 'compass'], mods: [{ stat: 'surveyRadius', op: 'add', value: 2 }] },
    { id: 'hearth', pos: 'suf', name: 'of the Hearth', for: ['cloak', 'lantern'], mods: [{ stat: 'cold', op: 'mul', value: 0.8 }] },
    { id: 'vigor', pos: 'suf', name: 'of Vigor', for: 'gear', mods: [{ stat: 'restGain', op: 'mul', value: 1.3 }] },
    { id: 'well', pos: 'suf', name: 'of the Wellfinder', for: ['compass', 'spyglass', 'staff'], mods: [{ stat: 'wellfinder', op: 'add', value: 1 }] },
    { id: 'swift', pos: 'suf', name: 'of Swiftness', for: ['boots'], mods: [{ stat: 'moveTime', op: 'mul', value: 0.85 }] },
    { id: 'owl', pos: 'suf', name: 'of the Owl', for: ['lantern', 'cloak'], mods: [{ stat: 'nightSight', op: 'add', value: 1 }] },
    { id: 'thirsty', pos: 'suf', name: 'of Thirst', for: 'gear', cursed: true, mods: [{ stat: 'waterDrain', op: 'mul', value: 1.25 }] }
  ]
};

/* RULES: pure game logic. No drawing, no DOM. State is plain data, so it can be saved, replayed and tested. */
const Rules = (() => {
  const C = CONTENT, W = 36, H = 36, VERSION = 1, START = 6 * 60;
  const TERR = ['plain', 'hill', 'mountain'];
  const byId = (list, id) => list.find(e => e.id === id);
  const idx = (x, y) => y * W + x;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function mulberry(seed) {
    let a = seed | 0;
    return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), a | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function srand(s) { s.rng = (s.rng + 0x6D2B79F5) | 0; let t = Math.imul(s.rng ^ (s.rng >>> 15), s.rng | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }

  /* Rule 1: systems talk through events and shared state, never to each other. */
  const listeners = {};
  function on(type, fn) { (listeners[type] = listeners[type] || []).push(fn); }
  function emit(s, type, data) { (listeners[type] || []).forEach(fn => fn(s, data)); }
  on('log', (s, d) => { s.log.push({ t: s.time, msg: d.msg, tone: d.tone || '' }); if (s.log.length > 80) s.log.shift(); });
  const say = (s, msg, tone) => emit(s, 'log', { msg, tone });

  function clock(s) { const m = START + s.time; const mod = m % 1440; const hour = Math.floor(mod / 60); return { day: Math.floor(m / 1440) + 1, hour, min: Math.floor(mod % 60), isDay: hour >= 6 && hour < 20 }; }
  const biomeOf = s => byId(C.biomes, s.biome), civOf = s => byId(C.civs, s.civ), godOf = s => byId(C.gods, s.god);
  const phase = s => clock(s).isDay ? biomeOf(s).day : biomeOf(s).night;
  const here = s => idx(s.player.x, s.player.y);
  const siteHere = s => s.sites[here(s)] || null;
  const isShelter = site => !!site && (site.kind === 'cave' || site.kind === 'ruin' || site.kind === 'well');
  const inShelter = s => isShelter(siteHere(s));
  const atCamp = s => s.camp === here(s);

  /* Items */
  function makeItem(s, baseId, pre, suf, known) {
    const b = byId(C.bases, baseId);
    const it = { id: s.nextId++, base: baseId, pre: pre || null, suf: suf || null, known: !!known || !!b.plain, carried: 0 };
    if (b.mystery) it.effect = Math.floor(srand(s) * C.flasks.length);
    return it;
  }
  function genItem(s) {
    const pool = C.bases.filter(b => b.w > 0); let tot = pool.reduce((a, b) => a + b.w, 0), r = srand(s) * tot, base = pool[0];
    for (const b of pool) { r -= b.w; if (r <= 0) { base = b; break; } }
    let pre = null, suf = null;
    if (!base.consumable) {
      const fits = pos => C.affixes.filter(a => a.pos === pos && (a.for === 'gear' || a.for.includes(base.id)));
      const pick = a => a[Math.floor(srand(s) * a.length)];
      if (srand(s) < 0.45) pre = pick(fits('pre')).id;
      if (srand(s) < 0.45) suf = pick(fits('suf')).id;
    }
    return makeItem(s, base.id, pre, suf, false);
  }
  function itemName(it) {
    const b = byId(C.bases, it.base);
    if (!it.known) return b.name + ' (unstudied)';
    if (b.mystery) return C.flasks[it.effect].name;
    const p = it.pre ? byId(C.affixes, it.pre).name + ' ' : '', f = it.suf ? ' ' + byId(C.affixes, it.suf).name : '';
    return (p || f) ? p + b.name + f : (b.plain ? b.name : 'Plain ' + b.name);
  }
  function itemAffixes(it) { return [it.pre, it.suf].filter(Boolean).map(id => byId(C.affixes, id)); }
  function itemWeight(s, it) { let w = byId(C.bases, it.base).wt; if (!s.off.affixes) for (const a of itemAffixes(it)) if (a.wtMul !== undefined) w *= a.wtMul; return w; }
  function weight(s) { return s.player.water + s.player.fuel * 0.5 + s.player.items.reduce((a, it) => a + itemWeight(s, it), 0); }

  /* Rule 3: every number passes through one modifier stack. A new feature is a new source. */
  const SOURCES = [
    { id: 'gear', fn(s, out) { for (const it of s.player.items) for (const m of (byId(C.bases, it.base).mods || [])) if (!m.needsFuel || s.player.fuel > 0) out.push(m); } },
    { id: 'affixes', fn(s, out) { for (const it of s.player.items) for (const a of itemAffixes(it)) for (const m of a.mods) out.push(m); } },
    { id: 'biome', fn(s, out) { for (const m of phase(s).mods) out.push(m); } },
    { id: 'weather', fn(s, out) { if (s.weather.storm) for (const m of biomeOf(s).storm.mods) out.push(m); } },
    { id: 'gods', fn(s, out) { if (!s.pact) return; const d = clock(s).isDay ? 'day' : 'night'; for (const m of byId(C.gods, s.pact).mods) if (!m.when || m.when === d) out.push(m); } },
    { id: 'shelter', fn(s, out) { if (inShelter(s)) { out.push({ stat: 'cold', op: 'mul', value: 0.25 }); out.push({ stat: 'stormCold', op: 'mul', value: 0 }); } if (atCamp(s)) out.push({ stat: 'warm', op: 'add', value: 25 }); } },
    { id: 'load', fn(s, out, ctx) { if (ctx.noLoad) return; const over = Math.max(0, weight(s) / carryCap(s) - 0.5); if (over > 0) { out.push({ stat: 'moveTime', op: 'mul', value: 1 + over }); out.push({ stat: 'staminaCost', op: 'mul', value: 1 + over }); } } }
  ];
  function stat(s, name, base, ctx) {
    ctx = ctx || {}; let add = 0, mul = 1, max = Infinity;
    for (const src of SOURCES) { if (s.off[src.id]) continue; const out = []; src.fn(s, out, ctx);
